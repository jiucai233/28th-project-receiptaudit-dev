name: Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  Build_and_Push_Docker_Images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: backend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/transparent-audit-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: .
          file: frontend.Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/transparent-audit-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Deploy_to_EC2:
    needs: Build_and_Push_Docker_Images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yml"
          target: "~/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          envs: DOCKER_USERNAME,UPSTAGE_API_KEY,DATABASE_URL,FRONTEND_URL
          script: |
            # Set Environment Variables for docker-compose
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            
            # Add other secrets to .env if needed (assuming they are in GitHub Secrets)
            # You should populate these secrets in your GitHub Repo Settings
            echo "UPSTAGE_API_KEY=${{ secrets.UPSTAGE_API_KEY }}" >> .env
            # FRONTEND_URL is for Backend CORS (e.g. your EC2 IP/Domain)
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL_PROD }}" >> .env
            
            # API_URL is used by Frontend Build, but here we run the pre-built image.
            # However, docker-compose.yml uses ${API_URL} default? 
            # Actually, since we use 'image:', the 'build:' section is ignored by 'docker compose up',
            # so API_URL env var here doesn't affect the running container's code (baked in).
            # But we might need it to suppress warnings if docker-compose tries to validate config.
            echo "API_URL=${{ secrets.PROD_API_URL }}" >> .env

            # Pull latest images
            docker compose pull

            # Cleanup old images
            docker image prune -af 

            # Restart services
            docker compose up -d --remove-orphans

            # Check status
            docker compose ps
